<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พิพิธภัณฑ์เสมือนจริง: วิวัฒนาการคอมพิวเตอร์ 5 ยุค</title>
  
  <!-- โหลดฟอนต์ Noto Sans Thai และ Sarabun จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans Thai', 'Sarabun', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* แถบปุ่มนำทางด้านล่างสำหรับหน้าจอมือถือและเดสก์ท็อป */
    #nav-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 30px;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #nav-bar::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      background: #2e3440;
      color: #eceff4;
      border: 1px solid #4c566a;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .nav-btn:hover, .nav-btn:active {
      background: #5e81ac;
      color: #ffffff;
      border-color: #88c0d0;
      transform: translateY(-2px);
    }

    /* คำแนะนำเบื้องต้นมุมซ้ายบน */
    #instruction-box {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 20, 20, 0.75);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 9999;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- กล่องคำแนะนำการควบคุม -->
  <div id="instruction-box">
    <strong>การควบคุม:</strong><br>
    • คอมพิวเตอร์: คลิกเมาส์เพื่อหันมุมมอง, ปุ่ม W A S D เพื่อเดิน<br>
    • มือถือ/VR: แตะปุ่มโซนด้านล่าง หรือคลิกจุดวงกลมบนพื้นเพื่อวาร์ป
  </div>

  <!-- แถบปุ่มนำทางโซนที่ขอบล่างจอ -->
  <div id="nav-bar">
    <button class="nav-btn" onclick="teleportTo(0)">ทางเข้า</button>
    <button class="nav-btn" onclick="teleportTo(1)">โซน 1</button>
    <button class="nav-btn" onclick="teleportTo(2)">โซน 2</button>
    <button class="nav-btn" onclick="teleportTo(3)">โซน 3</button>
    <button class="nav-btn" onclick="teleportTo(4)">โซน 4</button>
    <button class="nav-btn" onclick="teleportTo(5)">โซน 5</button>
  </div>

  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    
    <!-- a-assets สำหรับพัก canvas พื้นผิวข้อความ -->
    <a-assets id="assets-container">
      <!-- canvas จะถูกสร้างและใส่ลงในนี้ผ่าน JavaScript -->
    </a-assets>

    <!-- ระบบแสงสว่าง -->
    <!-- 1. Ambient Light สีขาวนวล intensity 1.0 -->
    <a-light type="ambient" color="#fbf9f5" intensity="1.0"></a-light>
    
    <!-- 2. Hemisphere Light intensity 0.6 -->
    <a-light type="hemisphere" ground-color="#8a857d" color="#ffffff" intensity="0.6"></a-light>

    <!-- 3. Point Light ประจำเหนือแต่ละโซนที่ y = 3.8, intensity 0.5 -->
    <a-light type="point" position="0 3.8 -8" intensity="0.5" distance="15"></a-light>
    <a-light type="point" position="0 3.8 -20" intensity="0.5" distance="15"></a-light>
    <a-light type="point" position="0 3.8 -32" intensity="0.5" distance="15"></a-light>
    <a-light type="point" position="0 3.8 -44" intensity="0.5" distance="15"></a-light>
    <a-light type="point" position="0 3.8 -56" intensity="0.5" distance="15"></a-light>

    <!-- โครงสร้างสถาปัตยกรรมอาคารนิทรรศการ -->
    <!-- พื้น ขนาด 12 x 72 หมุน -90 องศาแกน x ที่ตำแหน่ง 0 0 -32 สี #d8d4cc -->
    <a-plane position="0 0 -32" rotation="-90 0 0" width="12" height="72" color="#d8d4cc" roughness="0.8"></a-plane>

    <!-- เพดาน ขนาด 12 x 72 ที่ระดับความสูง y = 4.2 สีขาวนวล -->
    <a-plane position="0 4.2 -32" rotation="90 0 0" width="12" height="72" color="#faf8f5" roughness="0.9"></a-plane>

    <!-- ผนังยาวสองด้านที่ x = -6 และ x = 6 สีครีม #efece5 -->
    <a-plane position="-6 2.1 -32" rotation="0 90 0" width="72" height="4.2" color="#efece5" roughness="0.9"></a-plane>
    <a-plane position="6 2.1 -32" rotation="0 -90 0" width="72" height="4.2" color="#efece5" roughness="0.9"></a-plane>

    <!-- ผนังปิดหัวและท้ายอาคารที่ z = 4 และ z = -68 -->
    <a-plane position="0 2.1 4" rotation="0 180 0" width="12" height="4.2" color="#efece5" roughness="0.9"></a-plane>
    <a-plane position="0 2.1 -68" rotation="0 0 0" width="12" height="4.2" color="#efece5" roughness="0.9"></a-plane>

    <!-- โครงสร้างกล้อง Rig และ Camera -->
    <!-- ตำแหน่งเริ่มต้นที่ทางเข้าอาคาร z = 2 -->
    <a-entity id="cameraRig" position="0 0 2">
      <a-camera id="headCamera" look-controls wasd-controls="acceleration: 25">
        <!-- วงกลมเล็งกลางจอ (Reticle) สำหรับโหมดแว่น VR ยิงไปที่ .clickable -->
        <a-entity cursor="fuse: false"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                  material="color: #4a90e2; shader: flat; opacity: 0.75"
                  raycaster="objects: .clickable">
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- จุดวาร์ปวงกลมเรืองแสงบนพื้น 6 จุด (ทางเข้า + 5 โซน) -->
    <!-- แตะที่แผ่นเพื่อวาร์ปไปยัง z ของโซน + 4.5 -->
    <a-cylinder class="clickable" position="0 0.02 2" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(0)"></a-cylinder>

    <a-cylinder class="clickable" position="0 0.02 -3.5" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(1)"></a-cylinder>

    <a-cylinder class="clickable" position="0 0.02 -15.5" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(2)"></a-cylinder>

    <a-cylinder class="clickable" position="0 0.02 -27.5" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(3)"></a-cylinder>

    <a-cylinder class="clickable" position="0 0.02 -39.5" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(4)"></a-cylinder>

    <a-cylinder class="clickable" position="0 0.02 -51.5" radius="0.75" height="0.02" 
                material="color: #5e81ac; opacity: 0.85; emissive: #88c0d0; emissiveIntensity: 0.3" 
                onclick="teleportTo(5)"></a-cylinder>

    <!-- ==================== โซนจัดแสดงที่ 1 (z = -8) ==================== -->
    <a-entity id="zone-1">
      <!-- แท่นจัดแสดงทรงกระบอก รัศมี 0.55 สูง 0.9 สีเทาหินอุ่น #8a857d -->
      <a-cylinder position="0 0.45 -8" radius="0.55" height="0.9" color="#8a857d" roughness="0.7"></a-cylinder>
      <!-- ป้ายชื่อยุคลอยเหนือป้ายข้อมูล ที่ (0, 4.2, z - 2.2) = (0, 4.2, -10.2) -->
      <a-plane id="title-plane-1" position="0 4.0 -10.2" width="3.2" height="0.55" material="shader: flat; transparent: true"></a-plane>
      <!-- ป้ายข้อมูลขนาด 3.2 x 2.0 ที่ (0, 2.6, z - 2.2) = (0, 2.6, -10.2) -->
      <a-plane id="info-plane-1" position="0 2.6 -10.2" width="3.2" height="2.0" material="shader: flat; transparent: true"></a-plane>
    </a-entity>

    <!-- ==================== โซนจัดแสดงที่ 2 (z = -20) ==================== -->
    <a-entity id="zone-2">
      <a-cylinder position="0 0.45 -20" radius="0.55" height="0.9" color="#8a857d" roughness="0.7"></a-cylinder>
      <a-plane id="title-plane-2" position="0 4.0 -22.2" width="3.2" height="0.55" material="shader: flat; transparent: true"></a-plane>
      <a-plane id="info-plane-2" position="0 2.6 -22.2" width="3.2" height="2.0" material="shader: flat; transparent: true"></a-plane>
    </a-entity>

    <!-- ==================== โซนจัดแสดงที่ 3 (z = -32) ==================== -->
    <a-entity id="zone-3">
      <a-cylinder position="0 0.45 -32" radius="0.55" height="0.9" color="#8a857d" roughness="0.7"></a-cylinder>
      <a-plane id="title-plane-3" position="0 4.0 -34.2" width="3.2" height="0.55" material="shader: flat; transparent: true"></a-plane>
      <a-plane id="info-plane-3" position="0 2.6 -34.2" width="3.2" height="2.0" material="shader: flat; transparent: true"></a-plane>
    </a-entity>

    <!-- ==================== โซนจัดแสดงที่ 4 (z = -44) ==================== -->
    <a-entity id="zone-4">
      <a-cylinder position="0 0.45 -44" radius="0.55" height="0.9" color="#8a857d" roughness="0.7"></a-cylinder>
      <a-plane id="title-plane-4" position="0 4.0 -46.2" width="3.2" height="0.55" material="shader: flat; transparent: true"></a-plane>
      <a-plane id="info-plane-4" position="0 2.6 -46.2" width="3.2" height="2.0" material="shader: flat; transparent: true"></a-plane>
    </a-entity>

    <!-- ==================== โซนจัดแสดงที่ 5 (z = -56) ==================== -->
    <a-entity id="zone-5">
      <a-cylinder position="0 0.45 -56" radius="0.55" height="0.9" color="#8a857d" roughness="0.7"></a-cylinder>
      <a-plane id="title-plane-5" position="0 4.0 -58.2" width="3.2" height="0.55" material="shader: flat; transparent: true"></a-plane>
      <a-plane id="info-plane-5" position="0 2.6 -58.2" width="3.2" height="2.0" material="shader: flat; transparent: true"></a-plane>
    </a-entity>

  </a-scene>

  <script>
    /**
     * ฟังก์ชันตัดคำภาษาไทยตามมาตรฐาน Intl.Segmenter
     * สะสมคำไปเรื่อย ๆ จนกระทั่งความกว้างเกิน maxWidth จึงขึ้นบรรทัดใหม่
     * ป้องกันการตัดกลางคำหรือตัดแยกพยัญชนะ-สระ
     */
    function wrapThaiText(ctx, text, maxWidth) {
      const segmenter = new Intl.Segmenter('th', { granularity: 'word' });
      const paragraphs = text.split('\n');
      const lines = [];

      for (const paragraph of paragraphs) {
        if (paragraph.trim() === '') {
          lines.push('');
          continue;
        }

        const segments = Array.from(segmenter.segment(paragraph));
        let currentLine = '';

        for (const seg of segments) {
          const word = seg.segment;
          const testLine = currentLine + word;
          const metrics = ctx.measureText(testLine);

          if (metrics.width > maxWidth && currentLine !== '') {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        }

        if (currentLine) {
          lines.push(currentLine);
        }
      }

      return lines;
    }

    /**
     * ฟังก์ชันสร้าง Canvas ภาษาไทยความละเอียดสูง
     * คูณความละเอียดด้วย devicePixelRatio อย่างน้อย 2 เท่า
     * และตั้งค่าฟอนต์ Noto Sans Thai / Sarabun
     */
    function makeThaiPanel(text, options = {}) {
      const baseWidth = options.width || 1024;
      const baseHeight = options.height || 640;
      // ความละเอียดขั้นต่ำ 2x ตามข้อกำหนดเพื่อความคมชัดระยะใกล้
      const scale = Math.max(window.devicePixelRatio || 1, 2);

      const canvas = document.createElement('canvas');
      canvas.width = baseWidth * scale;
      canvas.height = baseHeight * scale;

      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      // วาดพื้นหลังป้าย
      ctx.fillStyle = options.bgColor || '#1e2430';
      const radius = options.borderRadius || 24;
      
      // ฟังก์ชันวาดสี่เหลี่ยมมุมมน
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(baseWidth - radius, 0);
      ctx.quadraticCurveTo(baseWidth, 0, baseWidth, radius);
      ctx.lineTo(baseWidth, baseHeight - radius);
      ctx.quadraticCurveTo(baseWidth, baseHeight, baseWidth - radius, baseHeight);
      ctx.lineTo(radius, baseHeight);
      ctx.quadraticCurveTo(0, baseHeight, 0, baseHeight - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // เส้นขอบป้าย
      ctx.lineWidth = options.borderWidth || 4;
      ctx.strokeStyle = options.borderColor || '#4c566a';
      ctx.stroke();

      // การตั้งค่าตัวอักษร
      const fontSize = options.fontSize || 32;
      const fontWeight = options.fontWeight || '400';
      ctx.font = `${fontWeight} ${fontSize}px 'Noto Sans Thai', 'Sarabun', sans-serif`;
      ctx.fillStyle = options.textColor || '#ffffff';
      ctx.textBaseline = 'top';

      const padding = options.padding || 48;
      const maxTextWidth = baseWidth - (padding * 2);
      const lineHeight = options.lineHeight || (fontSize * 1.55);

      const lines = wrapThaiText(ctx, text, maxTextWidth);

      // คำนวณตำแหน่งการวางข้อความ
      let startY = padding;
      if (options.alignCenterY) {
        const totalTextHeight = lines.length * lineHeight;
        startY = Math.max(padding, (baseHeight - totalTextHeight) / 2);
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        let startX = padding;

        if (options.textAlign === 'center') {
          const m = ctx.measureText(line);
          startX = (baseWidth - m.width) / 2;
        }

        ctx.fillText(line, startX, startY + (i * lineHeight));
      }

      return canvas;
    }

    /**
     * ฟังก์ชันเชื่อม Canvas เข้ากับ A-Frame a-plane ผ่าน material="src: #id"
     */
    function applyCanvasToPlane(planeEl, canvas, canvasId) {
      canvas.id = canvasId;
      const assets = document.getElementById('assets-container');
      assets.appendChild(canvas);

      // กำหนดค่า src ให้วัสดุของ Plane
      planeEl.setAttribute('material', `src: #${canvasId}; transparent: true; roughness: 0.5; metalness: 0.1;`);
    }

    /**
     * ฟังก์ชันวาร์ปกล้อง Rig ไปยังตำแหน่งที่กำหนด
     * ห่างจากแท่นไปทางทิศบวกของแกน z เท่ากับ 4.5 เมตร เพื่อเว้นระยะให้มองเห็นชัดเจน
     */
    function teleportTo(zoneIndex) {
      const rig = document.getElementById('cameraRig');
      const head = document.getElementById('headCamera');

      // พิกัด z สำหรับจุดยืนชมของแต่ละโซน (z ของโซน + 4.5)
      const targetZMap = {
        0: 2.0,            // ทางเข้า
        1: -8 + 4.5,       // โซน 1: z = -3.5
        2: -20 + 4.5,      // โซน 2: z = -15.5
        3: -32 + 4.5,      // โซน 3: z = -27.5
        4: -44 + 4.5,      // โซน 4: z = -39.5
        5: -56 + 4.5       // โซน 5: z = -51.5
      };

      const targetZ = targetZMap[zoneIndex] !== undefined ? targetZMap[zoneIndex] : 2.0;

      // ปรับตำแหน่ง rig ให้ x = 0, y = 0, z = targetZ
      rig.setAttribute('position', { x: 0, y: 0, z: targetZ });
      
      // ปรับมุมหันของศีรษะให้มองตรงไปข้างหน้า (หันเข้าหาแท่นจัดแสดง)
      if (head) {
        head.setAttribute('rotation', { x: 0, y: 0, z: 0 });
      }
    }

    // ข้อมูลเนื้อหาของแต่ละโซนสำหรับการทดสอบระบบข้อความไทย
    const zonesData = [
      {
        id: 1,
        title: "โซน 1 ยุคเครื่องกล ก่อน ค.ศ. 1940",
        info: "ยุคเริ่มต้นแห่งการประมวลผล\n\nมนุษย์ใช้อุปกรณ์กลไกฟันเฟืองและแรงกลในการคิดคำนวณ เช่น ลูกคิด, แท่งคำนวณของเนเปียร์, เครื่องคำนวณของปาสคาล และเครื่องผลต่าง (Difference Engine) ของชาร์ลส์ แบบเบจ ซึ่งเป็นรากฐานสำคัญของคอมพิวเตอร์สมัยใหม่ที่ยังไม่ใช้ระบบไฟฟ้า"
      },
      {
        id: 2,
        title: "โซน 2 ยุคหลอดสุญญากาศ ค.ศ. 1940-1956",
        info: "คอมพิวเตอร์ยุคที่หนึ่ง\n\nเริ่มนำวงจรอิเล็กทรอนิกส์และหลอดสุญญากาศ (Vacuum Tube) มาใช้เป็นสวิตช์เปิดปิดกระแสไฟฟ้า คอมพิวเตอร์มีขนาดมหึมาเท่าห้องโถง ใช้พลังงานความร้อนสูง เกิดความเสียหายของหลอดบ่อยครั้ง บันทึกข้อมูลด้วยบัตรเจาะรู เช่น ENIAC, EDVAC และ UNIVAC"
      },
      {
        id: 3,
        title: "โซน 3 ยุคทรานซิสเตอร์ ค.ศ. 1956-1963",
        info: "คอมพิวเตอร์ยุคที่สอง\n\nการประดิษฐ์ทรานซิสเตอร์จากสารกึ่งตัวนำเข้ามาแทนที่หลอดสุญญากาศ ส่งผลให้เครื่องมีขนาดเล็กลงอย่างมหาศาล ทำงานได้เร็วขึ้น กินไฟน้อยลง และมีความเสถียรสูงขึ้น ในยุคนี้เริ่มมีการพัฒนาภาษาโปรแกรมระดับสูง เช่น FORTRAN และ COBOL"
      },
      {
        id: 4,
        title: "โซน 4 ยุควงจรรวมและไมโครโพรเซสเซอร์ ค.ศ. 1964-1980",
        info: "คอมพิวเตอร์ยุคที่สามและสี่\n\nการรวมทรานซิสเตอร์จำนวนมากลงบนแผ่นซิลิคอนชิปขนาดจิ๋ว (Integrated Circuit - IC) จนกระทั่งพัฒนาเป็นไมโครโพรเซสเซอร์เบ็ดเสร็จในชิปเดียว (CPU) ทำให้เกิดเครื่องคอมพิวเตอร์ส่วนบุคคล (Personal Computer - PC) ที่ทุกคนเข้าถึงได้"
      },
      {
        id: 5,
        title: "โซน 5 ยุคเครือข่ายและปัญญาประดิษฐ์ ค.ศ. 1990 ถึงปัจจุบัน",
        info: "คอมพิวเตอร์ยุคที่ห้า\n\nการประมวลผลแบบขนาน เครือข่ายอินเทอร์เน็ตความเร็วสูง และระบบคลาวด์ คอมพิวเตอร์ไม่ได้จำกัดแค่การคำนวณทางคณิตศาสตร์ แต่สามารถเรียนรู้ อนุมาน และประมวลผลภาษาธรรมชาติด้วยปัญญาประดิษฐ์ (AI) เชื่อมโยงอุปกรณ์ต่าง ๆ ทั่วโลกอย่างไร้รอยต่อ"
      }
    ];

    // เริ่มต้นสร้างและเรนเดอร์ข้อความไทยเมื่อฟอนต์จาก Google Fonts โหลดเสร็จสมบูรณ์
    document.fonts.ready.then(() => {
      zonesData.forEach(zone => {
        // 1. สร้างป้ายชื่อยุค (Title Panel)
        const titleCanvas = makeThaiPanel(zone.title, {
          width: 1280,
          height: 220,
          fontSize: 48,
          fontWeight: '700',
          textColor: '#88c0d0',
          bgColor: '#242933',
          borderColor: '#88c0d0',
          borderWidth: 5,
          textAlign: 'center',
          alignCenterY: true
        });
        const titlePlane = document.getElementById(`title-plane-${zone.id}`);
        if (titlePlane) {
          applyCanvasToPlane(titlePlane, titleCanvas, `canvas-title-${zone.id}`);
        }

        // 2. สร้างป้ายข้อมูลประจำโซน (Info Panel)
        const infoCanvas = makeThaiPanel(zone.info, {
          width: 1280,
          height: 800,
          fontSize: 34,
          fontWeight: '400',
          textColor: '#e5e9f0',
          bgColor: '#1a1e24',
          borderColor: '#4c566a',
          borderWidth: 4,
          padding: 56,
          lineHeight: 56,
          textAlign: 'left'
        });
        const infoPlane = document.getElementById(`info-plane-${zone.id}`);
        if (infoPlane) {
          applyCanvasToPlane(infoPlane, infoCanvas, `canvas-info-${zone.id}`);
        }
      });
    });
  </script>
</body>
</html>
